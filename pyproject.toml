[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlflow-standalone"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.23.0", "tiktoken==0.9.0", "PyYAML==6.0.2", "fastapi==0.115.12", "uvicorn==0.34.2"]

[project.scripts]
rlflow = "rlflow.cli:main"

[tool.setuptools.packages.find]
include = ["rlflow*", "schemas", "roles", "tests*"]

[tool.setuptools.cmdclass]
build_py = "build_support.ControlBuild"

[tool.setuptools.package-data]
rlflow = ["hybrid_schemas/*.json", "static/*", "skills/rlflow/SKILL.md"]
schemas = ["*.json"]
roles = ["*.md", "*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
