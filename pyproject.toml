[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlflow-standalone"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.23.0", "tiktoken==0.9.0", "PyYAML==6.0.2"]

[project.scripts]
rlflow = "rlflow.cli:main"

[tool.setuptools.packages.find]
include = ["rlflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
